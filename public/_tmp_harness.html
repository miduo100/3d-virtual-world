<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>tmp harness</title>
<script src="/js/lib/three.min.js?v=185"></script>
<script src="/js/threejsCompatibility.js"></script>
<script src="/js/threejsCodeRunner.js"></script>
<script src="/js/threejsCodeNormalizer.js"></script>
<script src="/js/threejsInputAdapter.js"></script>
<script src="/js/threejsWorldSanitizer.js"></script>
</head>
<body>
<script>
window.__results = [];
window.__pageErrors = [];
window.addEventListener('error', function (e) { window.__pageErrors.push(String((e && e.message) || e)); });
window.addEventListener('unhandledrejection', function (e) { window.__pageErrors.push('unhandledrejection: ' + String(e && e.reason)); });

var FILES = ['草地.html','城堡.html','代码云.html','光柱.html','教学楼.html','小区.html','新的文档 7.html','展台.html'];

function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

async function testOne(fname) {
  var rec = { file: fname };
  var consoleErrs = [];
  var origErr = console.error;
  console.error = function () { consoleErrs.push(Array.prototype.map.call(arguments, String).join(' ')); };
  try {
    var raw = await (await fetch('/_tmp_samples/' + encodeURIComponent(fname))).text();
    rec.rawLen = raw.length;
    var detection = window.ThreeJSInputAdapter.detect(raw);
    rec.detectType = detection.type;
    var extracted = detection.code || raw;
    rec.extractedLen = extracted.length;

    // admin 保存链：normalize -> autoDetectCleanOptions(raw) -> cleanThreeJSCode
    var norm1 = window.ThreeJSCodeNormalizer.normalize(extracted, { aggressive: true, stripExports: true, stripImports: true, stripTypeScript: true });
    rec.fixes = (norm1.fixes || []).map(function (f) { return f.rule || String(f); });
    var cleanOpts = window.ThreeJSCodeNormalizer.autoDetectCleanOptions(raw);
    rec.cleanOpts = cleanOpts;
    var stored = window.ThreeJSCodeRunner.cleanThreeJSCode(norm1.code, cleanOpts);
    rec.storedLen = stored.length;

    // 世界侧执行：runThreeJSCode(stored, world)
    try {
      var res = window.ThreeJSCodeRunner.runThreeJSCode(stored, { mode: 'world' });
      rec.worldOk = !res.error;
      if (res.error) rec.worldError = String((res.error && res.error.message) || res.error);
      if (res.object) {
        var c = { meshes: 0, points: 0, lines: 0, sprites: 0, inst: 0, lights: 0 };
        res.object.traverse(function (o) {
          if (o.isInstancedMesh) c.inst++;
          else if (o.isMesh) c.meshes++;
          else if (o.isPoints) c.points++;
          else if (o.isLine) c.lines++;
          else if (o.isSprite) c.sprites++;
          if (o.isLight) c.lights++;
        });
        rec.counts = c;
        var box = new THREE.Box3().setFromObject(res.object);
        rec.boxOk = isFinite(box.min.x) && isFinite(box.max.x);
        if (rec.boxOk) {
          var s = new THREE.Vector3(); box.getSize(s);
          rec.size = [s.x, s.y, s.z].map(function (v) { return Math.round(v * 100) / 100; });
        }
      }
      rec.hasOnFrame = typeof res.onFrame === 'function';
      await sleep(1500);
      if (res.dispose) { try { res.dispose(); } catch (e) {} }
    } catch (e) {
      rec.worldOk = false;
      rec.worldError = 'THROW: ' + String((e && e.message) || e);
    }

    // 对照组 B：不做存储向清洗，直接跑规范化后的代码
    try {
      var res2 = window.ThreeJSCodeRunner.runThreeJSCode(norm1.code, { mode: 'world' });
      rec.worldOk2 = !res2.error;
      if (res2.error) rec.worldError2 = String((res2.error && res2.error.message) || res2.error);
      if (res2.object) {
        var c2 = { meshes: 0, points: 0, lines: 0, sprites: 0, inst: 0 };
        res2.object.traverse(function (o) {
          if (o.isInstancedMesh) c2.inst++;
          else if (o.isMesh) c2.meshes++;
          else if (o.isPoints) c2.points++;
          else if (o.isLine) c2.lines++;
          else if (o.isSprite) c2.sprites++;
        });
        rec.counts2 = c2;
        var box2 = new THREE.Box3().setFromObject(res2.object);
        if (isFinite(box2.min.x) && isFinite(box2.max.x)) {
          var s2 = new THREE.Vector3(); box2.getSize(s2);
          rec.size2 = [s2.x, s2.y, s2.z].map(function (v) { return Math.round(v * 100) / 100; });
        }
      }
      await sleep(1000);
      if (res2.dispose) { try { res2.dispose(); } catch (e) {} }
    } catch (e) {
      rec.worldOk2 = false;
      rec.worldError2 = 'THROW: ' + String((e && e.message) || e);
    }
  } catch (e) {
    rec.fatal = String((e && e.message) || e);
  }
  console.error = origErr;
  rec.consoleErrs = consoleErrs.slice(0, 6);
  window.__results.push(rec);
}

(async function () {
  for (var i = 0; i < FILES.length; i++) { await testOne(FILES[i]); }
  window.__done = true;
})();
</script>
</body>
</html>
